# ---------------------------------------------------------------
#  WALLPAPER — change this to your own image!
#  Default: Hyprland's own wallpaper (installed with the hyprland package).
#  Use an absolute path or ~/... (relative paths do NOT work here).
#     e.g.  path = ~/Pictures/my-wallpaper.png
# ---------------------------------------------------------------
wallpaper {
    monitor =
    path = /usr/share/hypr/wall0.png
    fit_mode = cover
}

splash = false
