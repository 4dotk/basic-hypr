# ---------------------------------------------------------------
#  HYPRIDLE — what happens when you leave the machine alone
#  Started from hypr/dots/autostart.lua.
#
#   2 min    dim the screen to 25%   (back to your brightness on any input)
#   5 min    lock (hyprlock)
#   5.5 min  screen off
#   15 min   sleep (suspend)
#
#  Apps that ask to stay awake (video players, browsers playing video)
#  pause all of this.
#  Screen on/off uses the Lua-config dispatch form (Hyprland 0.55+).
# ---------------------------------------------------------------

general {
    lock_cmd = pidof hyprlock || hyprlock                  # loginctl lock-session runs this
    before_sleep_cmd = loginctl lock-session               # lock before going to sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# dim (-s saves the current brightness, -r restores it)
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 25%
    on-resume = brightnessctl -r
}

# lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# sleep — delete this block to never sleep on your own
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
