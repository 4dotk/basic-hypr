# ---------------------------------------------------------------
#  HYPRLOCK — the lock screen
#  Lock with SUPER + L, the power dropdown, or hypridle after 5 min.
#
#  Sharp wallpaper; clock, date, password box and user on the left
#  (the wallpaper's logo is on the right). Font: Red Hat Display.
#  Colours: rgba(RRGGBBAA). Password box border: white while idle,
#  light blue while checking, amber on a wrong password or Caps Lock.
# ---------------------------------------------------------------

general {
    hide_cursor = true
    ignore_empty_input = true       # Enter on an empty box does nothing
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/Pictures/Saved/ecorp.jpg
    blur_passes = 0                 # keep it sharp
}

# clock
label {
    monitor =
    text = $TIME
    font_family = Red Hat Display Light
    font_size = 96
    color = rgba(ffffffff)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000059)
    position = 120, 130
    halign = left
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    font_family = Red Hat Display
    font_size = 22
    color = rgba(ffffffd9)
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000059)
    position = 124, 40
    halign = left
    valign = center
}

# password
input-field {
    monitor =
    size = 340, 52
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(ffffff40)
    inner_color = rgba(0a1630a6)    # dark navy, see-through
    font_color = rgba(ffffffff)
    font_family = Red Hat Display
    check_color = rgba(8fd3ffff)
    fail_color = rgba(e0a363ff)
    capslock_color = rgba(e0a363ff)
    fail_text = Wrong password
    placeholder_text =
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = false
    fade_on_empty = false
    position = 124, -45
    halign = left
    valign = center
}

# user
label {
    monitor =
    text = $USER
    font_family = Red Hat Display Medium
    font_size = 14
    color = rgba(ffffffa6)
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000059)
    position = 128, -105
    halign = left
    valign = center
}
