
# Font — copied from your Konsole profile
font_family JetBrainsMono Nerd Font
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

# Window
remember_window_size yes
initial_window_width 1100
initial_window_height 700
window_padding_width 8
hide_window_decorations no
confirm_os_window_close 0

# Vague theme — translated from Vague.colorscheme
background #141415
foreground #cdcdcd
background_opacity 0.90

# Cursor and selection
cursor #cdcdcd
cursor_text_color #141415
selection_background #606079
selection_foreground #cdcdcd
cursor_shape block
cursor_blink_interval 0

# Normal colors
color0  #1c1c24
color1  #c4615a
color2  #7fa563
color3  #e0a363
color4  #6e94b2
color5  #bb9dbd
color6  #9bb4bc
color7  #c3c3d5

# Bright / intense colors
color8  #606079
color9  #d84f51
color10 #7fa563
color11 #f3be7c
color12 #7e98e8
color13 #bb9dbd
color14 #b4d4cf
color15 #cdcdcd

# Terminal behavior
scrollback_lines 10000
enable_audio_bell no
copy_on_select no
detect_urls yes
url_style curly
shell_integration enabled

# Tabs
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2

# Keyboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+enter new_window
map ctrl+shift+equal increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+backspace restore_font_size

